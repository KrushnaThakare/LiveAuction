# Use pre-built images (no local build) — e.g. after docker push from CI.
#   docker compose -f deploy/aws/docker-compose.pull.yml up -d

version: '3.8'

services:
  mysql:
    image: mysql:8.0
    container_name: cricket-auction-mysql
    restart: unless-stopped
    environment:
      MYSQL_ROOT_PASSWORD: ${DB_PASSWORD:-root}
      MYSQL_DATABASE: cricket_auction
    ports:
      - "3306:3306"
    volumes:
      - mysql_data:/var/lib/mysql
    healthcheck:
      test: ["CMD", "mysqladmin", "ping", "-h", "localhost", "-u", "root", "-p${DB_PASSWORD:-root}"]
      interval: 10s
      timeout: 5s
      retries: 5

  backend:
    image: krushnathakare/cricket-auction-backend:latest
    container_name: cricket-auction-backend
    restart: unless-stopped
    depends_on:
      mysql:
        condition: service_healthy
    environment:
      DB_USERNAME: ${DB_USERNAME:-root}
      DB_PASSWORD: ${DB_PASSWORD:-root}
      SPRING_DATASOURCE_URL: ${DB_URL}
      CORS_ORIGINS: ${CORS_ORIGINS}
      JWT_SECRET: ${JWT_SECRET}
      ADMIN_USERNAME: ${ADMIN_USERNAME:-admin}
      ADMIN_PASSWORD: ${ADMIN_PASSWORD}
    ports:
      - "8080:8080"
    volumes:
      - cricket_uploads:/tmp/cricket-auction-uploads
      - cricket_images:/tmp/cricket-auction-images

  frontend:
    image: krushnathakare/cricket-auction-frontend:latest
    container_name: cricket-auction-frontend
    restart: unless-stopped
    depends_on:
      - backend
    ports:
      - "3000:80"

volumes:
  mysql_data:
  cricket_uploads:
  cricket_images:
